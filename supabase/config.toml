# Supabase CLI config. Used by `supabase functions deploy` (and local `supabase
# start`). Migrations live in supabase/migrations and are applied separately.
project_id = "tiqizsjxqfscwbhyvumk"

# send-push is invoked by the authenticated client, so JWT verification stays on
# (the caller's session identifies the reporter). The function uses the service
# role internally to read push tokens.
[functions.send-push]
verify_jwt = true
