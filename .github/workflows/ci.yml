name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes (free-tier friendly).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc sets legacy-peer-deps=true (React 19 peer friction), honored by npm ci.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:test

      - name: Unit tests
        run: npm run test:ci
