name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes (free-tier friendly).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc sets legacy-peer-deps=true (React 19 peer friction), honored by npm ci.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:test

      - name: Unit tests
        run: npm run test:ci

      # Catch Metro/bundling + native-config breakage that tsc and node-env jest
      # never surface (e.g. a bad import or Reanimated/worklets resolution issue).
      - name: Bundle smoke test
        run: npx expo export --platform web --output-dir /tmp/export-check

  edge-functions:
    name: Deno check (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check & lint edge functions
        working-directory: supabase/functions
        run: |
          deno check send-push/index.ts delete-account/index.ts
          deno lint send-push/index.ts delete-account/index.ts
