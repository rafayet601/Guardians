name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes (free-tier friendly).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps=true (React 19 peer friction), honored by npm ci.
      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:test

      - name: Unit tests
        run: npm run test:ci

      # Catch Metro/bundling + native-config breakage that tsc and node-env jest
      # never surface (e.g. a bad import or Reanimated/worklets resolution issue).
      - name: Bundle smoke test
        run: npx expo export --platform all --max-workers 2 --output-dir /tmp/export-check

  browser-tests:
    name: Mobile web smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  edge-functions:
    name: Deno check (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check & lint edge functions
        working-directory: supabase/functions
        # Glob covers every function (incl. future ones); _shared/* is
        # type-checked transitively via imports and linted by the bare
        # `deno lint` over the whole tree.
        run: |
          deno check */index.ts
          deno lint
          deno test _shared/*_test.ts

  db-tests:
    name: pgTAP database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts just the Postgres container (migrations from supabase/migrations
      # apply on boot), then runs every pgTAP suite in supabase/tests. Fails
      # the build if any RLS/RPC/security invariant regresses.
      - name: Start local database
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase db test
